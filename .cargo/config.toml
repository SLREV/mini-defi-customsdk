# Resolver MSRV-aware milik Cargo (stabil sejak Cargo 1.84).
#
# `incompatible-rust-versions = "fallback"` membuat Cargo memilih versi
# dependency terbaru yang masih bisa dibangun oleh MSRV workspace, bukan versi
# terbaru mutlak. Ini lapisan pertahanan terhadap error:
#
#   error: failed to parse manifest at `.../zeroize_derive-1.5.0/Cargo.toml`
#   Caused by: feature `edition2024` is required
#
# Kenapa di sini, bukan `resolver = "3"` di Cargo.toml: Anchor 0.31.1 mem-parse
# Cargo.toml dengan `cargo_toml 0.19` yang hanya mengenal resolver 1 dan 2,
# sehingga `resolver = "3"` membuat `anchor build`/`anchor deploy` gagal dengan
# "unknown variant `3`". File ini hanya dibaca Cargo asli.
#
# Jangan dihapus kecuali `cargo-build-sbf --version` sudah melaporkan rustc >= 1.85.
[resolver]
incompatible-rust-versions = "fallback"
