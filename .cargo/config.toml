# Cadangan kedua untuk `resolver = "3"` di Cargo.toml.
#
# `incompatible-rust-versions = "fallback"` (stabil sejak Cargo 1.84) membuat
# Cargo lebih memilih versi dependency yang masih bisa dibangun oleh toolchain
# kita, alih-alih mengambil versi terbaru yang butuh rustc/Cargo lebih baru.
#
# Kasus yang ditangani: `anchor build` gagal dengan
#   error: failed to parse manifest at `.../zeroize_derive-1.5.0/Cargo.toml`
#   Caused by: feature `edition2024` is required
# karena Cargo 1.84 (bawaan platform-tools SBF) belum mengenal edition 2024.
#
# Jangan dihapus kecuali `cargo-build-sbf --version` sudah melaporkan rustc >= 1.85.
[resolver]
incompatible-rust-versions = "fallback"
