[workspace]
members = ["programs/*"]
# JANGAN memakai `resolver = "3"` di sini.
#
# Anchor 0.31.1 membaca Cargo.toml memakai crate `cargo_toml 0.19`, yang enum
# Resolver-nya hanya punya V1/V2. Akibatnya `anchor build` / `anchor deploy`
# gagal sebelum build:
#
#   Error reading manifest from path: .../Cargo.toml
#   TOML parse error at line N: unknown variant `3`, expected `1` or `2`
#
# Resolver MSRV-aware tetap aktif lewat `.cargo/config.toml`
# (`[resolver] incompatible-rust-versions = "fallback"`), yang dibaca Cargo asli
# dan tidak pernah di-parse oleh Anchor.
resolver = "2"

[workspace.package]
# MSRV workspace untuk resolver MSRV-aware milik Cargo.
# Naikkan hanya setelah `cargo-build-sbf --version` melaporkan rustc >= 1.85.
rust-version = "1.84"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
