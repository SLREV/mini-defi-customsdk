[package]
name = "mini-amm"
version = "0.1.0"
description = "Token-2022 & SPL Hybrid Virtual Liquidity Constant Product AMM built with Anchor"
edition = "2021"
# MSRV eksplisit agar resolver MSRV-aware Cargo tahu batas versi dependency.
# Catatan: root Cargo.toml memakai `resolver = "2"`, bukan "3" — Anchor 0.31.1
# (cargo_toml 0.19) menolak resolver 3. Lihat README "Gagal `anchor build`".
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "mini_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "token_2022", "associated_token"] }
